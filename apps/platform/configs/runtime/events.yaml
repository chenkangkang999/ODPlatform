# apps/platform/configs/runtime/events.yaml
# =============================================================================
# 判罚事件（红牌 / 黄牌 / 换人）配置 —— 带注释的示例
# =============================================================================
#
# ★ 先读这一段：要工作，必须先训练【含这些类别】的模型
#
#   红牌/黄牌本质上是把"牌"当成一个【物体】来检测（裁判手里的一块红/黄矩形）；
#   换人靠的是检测第四官员举起的【换人牌】。
#
#   而本仓库当前的足球权重**只有 player / football 两类**，**检不出牌**。
#   也就是说：在把权重换成含这些类别的模型之前，本文件怎么调都**不会产出事件** ——
#   这是设计行为，不是 bug（检测结果里根本没有牌，自然无从判定）。
#
#   同样地，换人需要【可信的场地标定】才能判断"是否在边线附近"；
#   没有标定时它只会报候选，并在判据里写明"未标定"，不会假装确定。
#
# ★ 关于键名
#
#   所有键都可以删掉 —— 删掉就用默认值。默认值**只声明在**
#   src/od_platform/events/settings.py 的 dataclass 字段上，
#   逻辑代码里不出现任何阈值字面量。键名与字段同名。
# =============================================================================

# -----------------------------------------------------------------------------
# 类别名映射
#   模型训练时用的类名不受本项目控制：可能叫 red_card / 红牌 / card_red……
#   所以每个角色都配一组【别名】，匹配时大小写不敏感、自动忽略两端空白。
#   认不出的类名会被直接忽略（不会误当成牌），所以漏配的后果是"这项不工作"，
#   而不是"判错"。
# -----------------------------------------------------------------------------
classes:
  # 下面这些别名与 settings.py 的默认值**逐字一致** —— 有个测试专门断言
  # "示例配置 == 代码默认值"，防止两边随时间漂移。
  red_card_aliases: ["red_card", "redcard", "card_red", "red", "红牌"]
  yellow_card_aliases: ["yellow_card", "yellowcard", "card_yellow", "yellow", "黄牌"]
  # 只训练了一个通用 "card" 类时写在这里 —— 此时【由颜色】决定是红牌还是黄牌。
  generic_card_aliases: ["card", "cards", "牌", "卡片"]
  referee_aliases: ["referee", "ref", "referee_person", "裁判", "主裁判"]
  # 球员：找不到裁判时，退化成"离牌最近的球员"当出示者
  player_aliases: ["player", "person", "players", "球员", "人"]
  substitution_board_aliases: ["substitution_board", "substitution", "sub_board",
                               "subboard", "fourth_official_board", "换人牌", "换人"]

# -----------------------------------------------------------------------------
# 红 / 黄牌
# -----------------------------------------------------------------------------
cards:
  min_confidence: 0.3              # 牌本身的置信度下限（低于此值不算牌）
  # 牌面积占【画面】的比例范围。1080p 上 1e-5 约等于 21 像素 —— 再小就不可能是牌，
  # 更像噪点；上限 0.05 是防止把一大片同色区域（观众席/广告牌）当成牌。
  min_area_ratio: 0.00001
  max_area_ratio: 0.05
  # 牌的宽高比范围（宽/高）。牌是矩形：竖着举、横着举都在这个范围内；
  # 极端细长的多半是旗杆、天线、边线。
  min_aspect_ratio: 0.35
  max_aspect_ratio: 3.0
  # 牌到出示者的距离上限，单位是【出示者框的高度】——
  # 用相对尺度而不是像素/米，所以完全不依赖标定，也不受镜头远近影响。
  # 取值依据：举过头顶的牌离出示者中心约 0.6~0.8 个身高，侧举约 0.5；
  # 1.2 留了姿态变化余量。注意"牌躺在草地上"也约 0.5 ——
  # 单靠距离区分不了这两种，必要时把下面那行打开。
  max_show_distance_body_heights: 1.2
  prefer_referee: true             # 优先把【裁判】当出示者（牌是裁判掏的）
  require_card_above_anchor: false # 打开则要求牌位于出示者中心【之上】（更严，能排掉地上的牌）
  cooldown_frames: 30              # 同一类判罚在该帧数内只报一次（同一张牌会连续多帧被检到）
  unconfirmed_confidence_ceiling: 0.4   # "证据不足"事件的置信度上限 —— 数值上也不假装确定

  # 颜色二次确认：模型可能把黄牌判成红牌，所以对牌的裁剪区域做 HSV 校验。
  color:
    enabled: true
    # 颜色与模型类别矛盾时怎么办：
    #   downgrade   （默认）降级为"证据不足"，并写明原因 —— 不盲信模型
    #   trust_model 仍按模型类别采信，但把矛盾记进判据（留痕）
    conflict_policy: downgrade
    # HSV 段：(h_min, s_min, v_min, h_max, s_max, v_max)
    # ★ OpenCV 的 H 是 0..179（不是 0..360），所以红色必须拆成【两端】两段，
    #   只写一段会漏掉偏洋红侧的红。
    red_ranges: [[0, 70, 60, 10, 255, 255], [170, 70, 60, 179, 255, 255]]
    yellow_ranges: [[20, 70, 70, 35, 255, 255]]
    min_pixel_ratio: 0.15          # 该颜色像素占比达到此值才算"颜色成立"
    min_crop_pixels: 4             # 裁剪区域小于这么多像素就不判颜色（没有意义）

# -----------------------------------------------------------------------------
# 换人（第四官员举牌）
# -----------------------------------------------------------------------------
substitution:
  min_confidence: 0.3              # 换人牌本身的置信度下限
  min_area_ratio: 0.00001
  max_area_ratio: 0.08             # 换人牌比红黄牌大，上限放宽
  # 牌的【接地点】（框下边缘中点，不是框中心 —— 中心在透视下会系统性偏向场内）
  # 映射成场地坐标后，到最近一条【边线】（球场两条长边）的距离阈值（米）。
  touchline_margin_m: 3.0
  require_touchline_proximity: true   # 有可信标定时：不在边线附近就不构成换人
  # 没有【可信】标定时是否降级为候选。
  #   true （默认）→ 事件 confirmed=False，判据里写明"未标定"，不会假装确定
  #   false       → 只要检出换人牌就采信（不推荐，只在你确实不在乎位置时用）
  require_calibration: true
  allow_uncalibrated_candidates: true # 无标定时是否仍然把候选报出来（false = 直接不报）
  cooldown_frames: 30
  unconfirmed_confidence_ceiling: 0.4