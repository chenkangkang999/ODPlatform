# ============================================================
# 足球AI辅助裁判 —— 运行配置（几何 / 跟踪 / 检测 / 规则的唯一数据源）
#
# ★ 唯一加载口: od_platform.common.football_config（路径与读法只定义一次）
# ★ 本文件每一节都是【真正生效】的:
#     pitch / calibration / homography / rules / analyzer  → GeometricSettings
#     tracking                                             → TrackingSettings
#     detection                                            → DetectionSettings
#     action_recognition                                   → ActionRecognitionSettings
#
# ★ 代码里不写死任何阈值: 本文件的每一项都对应一个 dataclass 字段。
#   想知道"能调什么", 看对应子系统的 settings.py; 想知道"当前按什么在跑",
#   看结果里的 settings 审计块。
#
# ★ 运行期覆盖: Web 任务的 request.json 可覆盖 detection 的同名字段
#   （conf / iou / imgsz / max_det / stride / max_frames / device / tracking）。
# ============================================================

# ---------- 场地尺寸（默认 IFAB 国际比赛标准场地）----------
pitch:
  length: 105.0                # 场地长度（米）
  width: 68.0                  # 场地宽度（米）
  goal_width: 7.32             # 两门柱内沿距离
  goal_height: 2.44
  penalty_area_depth: 16.5
  penalty_area_width: 40.32
  goal_area_depth: 5.5
  goal_area_width: 18.32
  penalty_spot_distance: 11.0
  centre_circle_radius: 9.15
  corner_arc_radius: 1.0       # 角球弧半径（IFAB）; 判定"球是否摆在角球弧内"用
  # 非标准场地（青训 / 五人制）在这里覆盖即可, 全链路跟着变。

# ---------- 标定质量门槛与求解参数 ----------
calibration:
  min_points: 4                    # 求解单应性所需的最少对应点
  max_reprojection_error_m: 1.0    # 重投影误差上限（米）, 超过即拒绝该标定
  ransac_reprojection_px: 5.0      # >=5 点时 RANSAC 的内点阈值（像素）
  full_frame_tolerance_px: 2.0     # 判定"画面四角凑数"的容差（像素）
  point_range_factor: 2.0          # 像素点允许超出画面的倍数（防点错坐标）
  finite_margin: 1.0e-6
  coordinate_precision_px: 3       # 标定文件里像素坐标的小数位
  coordinate_precision_m: 4

# ---------- 几何层（球场标定从哪来）----------
# ★★ 没有标定就没有"米" ★★
# 这里【不再】放"整幅画面四角 ↔ 球场四角"的假标定。那等于假设照片恰好完整
# 框住球场且没有透视, 会让所有以米为单位的结论失真, 而能力标志却报告"已标定"。
#
# 标定必须来自下面三者之一, 否则几何事件（接触/出界/角球/点球/任意球）一律不产出:
#   1) 素材旁边的同名 sidecar: <素材名>.calibration.json
#   2) 素材同目录的 calibration.json
#   3) configs/runtime/calibrations/<素材名>.json
#
# 生成标定:
#   odp-calibrate --image <一帧图> --landmark <名>:<x>,<y> ... --save <名字>
#   odp-calibrate --list-landmarks        # 查看所有可用关键点名
homography:
  # 想固定用某个文件时打开下面这行（相对路径以 configs/runtime/ 为基准）:
  # calibration_file: calibrations/default.json
  #
  # 也可以把标定直接写在这里（推荐用 odp-calibrate 生成后粘过来）:
  # points:
  #   - {landmark: penalty_area_left_top,    pixel: [512.0, 402.0]}
  #   - {landmark: penalty_area_left_bottom, pixel: [498.0, 655.0]}
  #   - {landmark: halfway_bottom,           pixel: [960.0, 604.0]}
  #   - {landmark: goal_left_post_bottom,    pixel: [371.0, 470.0]}
  # image_size: [1920, 1080]

# ---------- 地图规则阈值 ----------
# ★ 变更: offside_margin_m / attacking_direction / attacking_team 已随【越位】规则一并
#   移除（新需求清单里没有越位, 留着就是一条死规则的专属配置）。
#   新增的是【定位球】判据: 角球(球在角球弧) / 点球(球在罚球点) / 任意球(球静止+
#   对手退够 9.15 米)。这三项是纯几何的, 不依赖任何模型, 因此不需要重新训练就能生效。
rules:
  collision_distance_m: 2.0         # 接触候选的距离阈值（米）
  ball_assignment_tolerance_m: 0.5  # 用"谁离球最近"估计球归属的距离（米）
  ball_radius_m: 0.11               # 5 号球半径（米）
  goal_line_tolerance_m: null       # 门线容差; null = 取 ball_radius_m
  goal_defending_team: null         # 该端球门的防守方; null 时出界只能报 unknown

  # ---- 定位球几何 ----
  corner_arc_tolerance_m: 0.5       # 球离最近角点多远仍算"摆在角球弧内"
  penalty_spot_tolerance_m: 1.0     # 球离罚球点多远仍算"摆在罚球点上"
  free_kick_wall_distance_m: 9.15   # IFAB Law 13: 防守方须退到 9.15 米
  wall_distance_tolerance_m: 0.5    # 人墙距离的容差（判"是否已退够"）

  # ---- "球静止"判定（任意球/点球的前置条件）----
  # 不能只看单帧速度: 标定抖动会让静止的球也算出速度。这里看窗口内的最大位移。
  ball_stationary_window_frames: 15
  ball_stationary_min_samples: 5
  ball_stationary_max_displacement_m: 0.5

# ---------- 分析器时序参数 ----------
# 注: 原来的 min_direction_delta_m（推断进攻方向）已随越位规则移除。
analyzer:
  event_cooldown_frames: 30         # 同类事件在该帧数内只报一次
  possession_memory_frames: 15      # 球归属结论保留多少帧

# ---------- 跟踪层（几何层内部使用的跟踪器）----------
# ★ 注意: 这里配置的【不是】对外产出 track_id 的那个跟踪器。
#   · 对外（frames.jsonl 的 track_id、annotated.png 上画的 ID）用的是
#     ultralytics 的 BoT-SORT, 参数在 configs/runtime/botsort.yaml（由
#     detection.tracker 指向）。
#   · 本节配置的是几何层内部的 MultiObjectTracker, 只服务接触/球归属/球静止的
#     时序判断, 不对外暴露 ID。
tracking:
  backend: botsort                  # botsort | bytetrack（两者共用两阶段关联实现）
  min_confidence: 0.25              # 进入跟踪的最低检测置信度
  high_threshold: 0.5               # 高分阶段阈值（ByteTrack 的 track_thresh）
  iou_threshold: 0.45               # 关联所需 IoU 下限
  max_age: 30                       # 丢失后保持多少帧
  min_hits: 3                       # 连续命中多少帧才确认
  max_tracks: 256                   # 活跃轨迹上限（保护内存）
  # 小目标（足球）专用: 球的框只有十几像素, 每帧位移与自身尺度同量级,
  # 纯 IoU 会让它每帧换一个 ID。尺度小于该值的目标准许用中心距离兜底关联;
  # 大目标（球员）仍然只认 IoU, 避免把两个挨着的人错配成同一条轨迹。
  small_object_extent_px: 48.0
  center_distance_gate: 1.0
  history_length: 64                # 每条轨迹保留多少帧历史（有界内存）
  # 代价矩阵的结构常量（不是调参）:
  #   IoU 代价 ∈ [0, 1); 中心距离兜底代价 ∈ [distance_cost_base, 2);
  #   invalid_cost 是"禁止匹配"的哨兵, 必须大于任何有效代价。
  distance_cost_base: 1.0
  invalid_cost: 10.0
  kalman:
    std_weight_position: 0.05       # = 1/20
    std_weight_velocity: 0.00625    # = 1/160
    initiate_position_factor: 2.0
    initiate_velocity_factor: 10.0
    aspect_std: 0.01
    aspect_velocity_std: 0.00001
    measurement_aspect_std: 0.1

# ---------- 检测层（真正生效: DetectionSettings）----------
# ★ 此前这些值写死在 bridge_worker.py 里, 本节形同虚设。现在:
#     · iou 不再是硬编码的 0.7, imgsz 不再是硬编码的 960;
#     · 本节的值是默认值, request.json 可逐项覆盖。
detection:
  conf: 0.25                        # 进入结果的置信度下限（范围 0.001~0.99）
  iou: 0.7                          # NMS 的 IoU 阈值（范围 (0, 1]）
  imgsz: 1280                       # 推理输入边长（320~1536 且必须是 32 的倍数）
  # ★ 与训练分辨率保持一致: train.yaml 用 1280 训练（足球框在原图里就只有 8.4px,
  #   640 会把它缩到 4.2px 导致学不到）。训练 1280 而推理 960 会白丢这部分收益。
  #   想换速度优先: 这里降到 960, 但要用 960 重新训练才匹配。
  max_det: 300                      # 每帧最多保留多少个框
  stride: 1                         # 视频抽帧步长（1~30）
  max_frames: 1500                  # 单任务处理帧数上限
  device: cpu                       # cpu | 0 | 0,1
  tracking: true                    # 视频是否开启多目标跟踪
  # 跟踪器配置。若 configs/runtime/ 下存在同名文件就用它（见 botsort.yaml）,
  # 否则把名字交给 ultralytics, 用它自带的 cfg/trackers/<名字>。
  tracker: botsort.yaml
  classes: [0, 1]                   # 0=player, 1=football（注意 COCO 编码里是反的）
  # ↑ 这个列表是【推理时保留哪些类】的过滤器, 不是"模型能检什么"。
  #   红牌/黄牌/换人牌要真正生效, 需要一个用这些类别**训练过**的模型, 并在
  #   configs/runtime/events.yaml 里把类名映射对上
  #   （本仓库现有权重只有 player/football, 检不出牌）。
  model: models/trained/football_yolo/weights/best.pt   # 说明性; 实际由 Web 侧 FOOTBALL_MODEL_PATH 决定

# ---------- 动作识别（真正生效: ActionRecognitionSettings）----------
# ★ 能力边界（如实记录, 别当成已支持）:
#   · 实际加载 videomae-base-finetuned-kinetics = VideoMAE V1 base + Kinetics-400（400 类）;
#   · model_name 只是分派键, 加载哪个模型由 checkpoint 决定;
#   · custom 未实现 —— 传进来只会降级为空结果;
#   · **slowfast 已删除**（代码里从未实现过, 且与 videomae 职责完全重叠）;
#   · Kinetics-400 里没有"假摔/肘击"这类足球犯规 → 要识别本项目的目标动作,
#     必须用自己的足球视频**微调**。姿态型动作（铲球/高抬腿）已由 pose 子系统
#     用骨骼几何判定, 不依赖这个分类器。
action_recognition:
  model_name: videomae              # 分派键; 已实现 videomae; custom 仅预留
  checkpoint: models/pretrained/videomae-base-kinetics
  clip_length: 16                   # 送入模型的帧数
  confidence_threshold: 0.3         # 低于此值不产出动作事件
  top_k: 5                          # 只看置信度最高的前 K 类

# ---------- 输出（说明性: odp-infer 走 infer_pipeline.yaml, 本仓库不读本节）----------
output:
  save_video: true
  save_json: true
  draw_tracks: true
  draw_homography_overlay: false