# =============================================================================
# 姿态估计与姿态型动作判据 —— 配置示例（键名与 PoseSettings 的字段同名）
# =============================================================================
# 用法:
#   from od_platform.pose import PoseSettings, PoseEstimator
#   settings = PoseSettings.load()            # 默认读本文件
#   estimator = PoseEstimator(settings)       # 权重拿不到时会优雅降级
#   poses = estimator.estimate(frame)
#
# 全部键都可省略 —— 省略即用 dataclass 里的默认值（本文件写的就是默认值）。
# 未知键会被 report_unknown_keys 记到日志, 不会被静默忽略。
#
# ★ 阈值的单位口径
#   * 带 _ratio 的项 = **相对于自身躯干长度**（肩中点→髋中点）的比值。
#     用比值而不是像素绝对量, 是为了与分辨率、机位、球员远近无关。
#     为什么不拿外接框当尺度: 外接框随四肢伸展剧烈变化（铲球躺下时又扁又宽）,
#     等于用被测量的动作去定义尺度本身。躯干长度在四肢运动时基本不变。
#   * 带 _deg 的项 = 角度（度）。
#   * 带 _m 的项 = 米（需要场地标定）。
# =============================================================================

model:
  # 权重文件名（相对 models/pretrained/ 解析）或绝对路径。
  # 本机实测: 让 ultralytics 自动下载会因证书链拿不到本地 CA 而
  # 报 SSLCertVerificationError; 所以请把 yolo11n-pose.pt 放到 models/pretrained/ 下。
  weights: yolo11n-pose.pt
  # 推理分辨率。姿态对分辨率比检测更敏感（关键点要定位到关节, 差几个像素就影响角度）, 
  # 但 640 是 COCO 训练尺度, 一般够用; 画面里人很小再往上加。
  imgsz: 640
  # 人体检测置信度下限。调低会带来更多误检人体, 也会让姿态判据吃到假人。
  conf: 0.25
  # NMS 的 IoU 阈值。人群密集（角球争顶）时可略调高以减少互相压制。
  iou: 0.7
  # 推理设备; 留空 = 交给 ultralytics 自动选（本机 8GB 显存, 建议留给训练用 cpu 跑演示）。
  device: ""
  # 单帧最多处理多少人。画面里人很多时保护性能, 超出部分按整体置信度丢弃。
  max_persons: 30
  # 单个关键点置信度下限, 低于它这个点算【不可用】。
  # ★ 这一点很关键: 不可用的点会让依赖它的判据直接返回"证据不足",
  #   而不是拿一个噪声坐标去算出一个看起来很像的结论。宁可不下结论。
  keypoint_conf: 0.50

thresholds:
  # ---- 高抬腿 ----
  # 判据量 = (髋_y - 踝_y) / 躯干长度（图像 y 向下为正）。
  # 正常站立时踝在髋下方很远, 该量约 -1.5; 抬到与髋同高约 0; 高于髋为正。
  # 0.10 表示"踝明显高于髋", 离正常值(-1.5)很远, 所以不会把普通跑动误判进来。
  high_leg_ankle_above_hip_ratio: 0.10

  # ---- 滑铲 ----
  # 髋部离自身最低点的高度 / 自身高度。站立约 0.45~0.50, 滑铲降到 0.1~0.2。
  slide_hip_height_ratio: 0.35
  # 膝关节伸展角（大腿-小腿夹角, 伸直约 180）。滑铲的伸腿那侧接近伸直。
  slide_knee_extension_deg: 150.0
  # 躯干相对竖直方向的倾角。正常跑动 < 20, 滑铲/摔倒时明显倾倒。
  slide_torso_incline_deg: 45.0

  # ---- 肘击 ----
  # 上臂(肩→肘)与躯干轴(肩→髋)的夹角, 即肩关节外展角。
  # 说明: "肘关节外展"解剖上不成立（肘只能屈伸）, 真正抬肘来自肩关节外展。
  # 手臂自然下垂时约 10~20, 抬肘到肩高水平约 90。
  elbow_abduction_deg: 60.0
  # 肘部到"最近对手头部"的距离 / 自身躯干长度。
  elbow_head_distance_ratio: 1.00

  # ---- 拉人推人 ----
  # 手臂【张开角】（度）: 在肩处量 (肩-腕) 与躯干轴 (肩-髋) 的夹角。
  # ★ 这才是关键判据。实测基准: 手臂自然下垂约 10°, 伸手抓人/推人约 60~90°。
  #   为什么不用下面的"伸展度"当关键判据: 自然下垂的手臂也是完全伸直的, 那个比值
  #   照样是 1.08 —— 它区分不了"垂着"和"伸出去", 会把每个站着的人都判成在拉人。
  pull_reach_abduction_deg: 45.0
  # 手臂伸展度 = 肩-腕距离 / 躯干长度。屈臂约 0.35, 完全伸直约 1.3。
  # 它只当"手臂没有折叠"的下限守卫（自然下垂 1.08 也能过, 那是预期的）。
  pull_reach_extension_ratio: 0.90
  # 手部到对手躯干中心的距离 / 自身躯干长度（**无标定时的近似判据, 只能当候选**）。
  pull_contact_distance_ratio: 1.20
  # 手部到对手躯干中心的距离上限（米）; 有标定时优先用这个（这才是物理判据）。
  pull_contact_distance_m: 2.00

  # ---- 通用 ----
  # 命中结论的置信度（= 关键点平均置信度 × 通过判据的比例）低于此值时降级为"候选"。
  min_hit_confidence: 0.50

# 没有场地标定时, 是否允许退化成"按身体比例近似"。
# ★ true 时这样得到的结论会被标注为 candidate（候选）而不是 judgement（判据）——
#   因为身体比例近似不知道镜头远近, 两个像素挨着的人可能在真实场地里差着两米。
#   要拿到米制判据, 就把几何子系统单应矩阵的 distance_m 作为 distance_fn 注入。
allow_uncalibrated_candidate: true